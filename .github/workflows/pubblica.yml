name: Pubblica sito e aggiorna dati

on:
  push:
    branches: [main]
  schedule:
    # ogni giorno (ora UTC): i dati di OpenStreetMap vengono riscaricati al massimo ogni 20 ore
    - cron: "17 3 * * *"
  workflow_dispatch:         # pulsante "Run workflow": riscarica subito i dati da OpenStreetMap

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Scarica i servizi sanitari da OpenStreetMap
        timeout-minutes: 45
        continue-on-error: true   # se Overpass non risponde, l'app chiede i dati direttamente dal telefono
        env:
          SITO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORZA: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node aggiorna_salute.js

      - name: Scarica orari, turni e servizi delle farmacie lombarde da Farmacia Aperta
        timeout-minutes: 10
        continue-on-error: true   # se Farmacia Aperta non risponde, l'app usa solo OpenStreetMap
        env:
          SITO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node aggiorna_farmacie.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
